<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Login page for the Employee Task Manager prototype for IMS566 individual assignment.">
  <title>Login - Employee Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-purple-900 to-slate-950 min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl shadow-xl w-80">
    <h2 class="text-2xl font-bold text-center mb-1 text-slate-800">
      Employee Task Manager
    </h2>
    <p class="text-xs text-center text-slate-500 mb-3">
      NAIMUS Corporation – Employee Portal
    </p>
    <!-- Error message -->
    <div id="err" class="text-red-500 text-sm mb-2"></div>

    <!-- Login form -->
    <form id="loginForm" class="space-y-3">
      <div>
        <label for="u" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input
          id="u"
          name="username"
          placeholder="Enter username"
          class="border w-full p-2 rounded"
          required
        />
      </div>
      <div>
        <label for="p" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          id="p"
          name="password"
          type="password"
          placeholder="Enter password"
          class="border w-full p-2 rounded"
          required
        />
      </div>
      <button
        type="submit"
        class="w-full bg-violet-600 hover:bg-violet-700 text-white font-semibold py-2 rounded mt-2"
      >
        Login
      </button>
    </form>
  </div>

  <script>
    // Simple hardcoded login
    function handleLogin() {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value.trim();
      const err = document.getElementById('err');

      if (username === 'admin' && password === '1234') {
        err.textContent = '';
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = 'Invalid username or password.';
      }
    }

    // Attach event listener to form submit
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', function (e) {
        e.preventDefault(); // prevent page reload
        handleLogin();
      });
    });
  </script>
</body>
</html>
